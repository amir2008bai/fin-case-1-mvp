[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "fintech-audit"
version = "2.0.0"
description = "Reproducible RL environment for training financial-audit agents (synthetic companies, hidden errors, reward)"
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = []

[project.scripts]
audit-env = "audit_env.__main__:main"

[tool.setuptools.packages.find]
include = ["audit_env*"]
