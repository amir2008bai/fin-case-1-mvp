<!doctype html><html><head><meta charset="utf-8"><style>
*{margin:0;box-sizing:border-box}html,body{width:1920px;height:1080px;overflow:hidden;background:#fff;font-family:"Inter Display",Inter,sans-serif;color:#202124}
.l{position:absolute;inset:0}#stage{perspective:1800px}
.dot{position:absolute;width:26px;height:26px;border-radius:50%}
.win{position:absolute;left:50%;top:50%;width:1440px;height:900px;margin:-450px 0 0 -720px;border-radius:14px;overflow:hidden;box-shadow:0 40px 120px rgba(16,60,40,.28),0 0 0 1px rgba(0,0,0,.06);background:#fff;transform-style:preserve-3d}
.win img{display:block;width:100%}
.big{position:absolute;left:0;right:0;text-align:center;font-weight:600;letter-spacing:-.03em}
.w{display:inline-block;margin:0 .14em}
.chip{position:absolute;padding:18px 30px;border-radius:999px;background:#fff;font-size:40px;font-weight:600;box-shadow:0 12px 40px rgba(0,0,0,.14)}
.chip b{font-weight:700}
.bar{position:absolute;left:520px;height:54px;border-radius:10px}
.lab{position:absolute;left:120px;font-size:34px;font-weight:500;width:380px;text-align:right}
.term{position:absolute;left:50%;top:50%;width:1100px;margin-left:-550px;border-radius:16px;background:#1e1e1e;color:#e8eaed;font:44px "Cascadia Mono",monospace;padding:46px 54px;box-shadow:0 40px 120px rgba(0,0,0,.3)}
</style></head><body><div id="stage" class="l"></div>
<script>
const C=["#4285F4","#EA4335","#FBBC04","#34A853"],G="#107C41";
const S=document.getElementById("stage");
const cl=(x,a=0,b=1)=>Math.min(b,Math.max(a,x)),e=x=>{x=cl(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2},eo=x=>1-Math.pow(1-cl(x),3);
const bk=x=>{x=cl(x);const c=1.70158;return 1+(c+1)*Math.pow(x-1,3)+c*Math.pow(x-1,2)};
function words(txt,t0,t,size,top,col){return `<div class="big" style="top:${top}px;font-size:${size}px;color:${col||'#202124'}">`+txt.split(" ").map((w,i)=>{const p=eo((t-t0-i*.07)/.5);return `<span class="w" style="opacity:${p};transform:translateY(${(1-p)*60}px);filter:blur(${(1-p)*10}px)">${w}</span>`}).join("")+"</div>"}
function render(t){let h="";
// scene 0: 0-3.6 question
if(t<4){const o=1-e((t-3.4)/.5);
 C.forEach((c,i)=>{const a=t*1.4+i*Math.PI/2,r=180+40*Math.sin(t*2+i),p=bk((t-.1-i*.08)/.6);h+=`<div class="dot" style="background:${c};left:${960+Math.cos(a)*r*1.9-13}px;top:${300+Math.sin(a)*r*.35-13}px;transform:scale(${p*o})"></div>`});
 h+=`<div class="l" style="opacity:${o};transform:scale(${1+t*.02})">`+words("Как понять, что ИИ‑аудитор",.4,t,104,420)+words("правда находит ошибки?",1.2,t,104,560,G)+"</div>"}
// scene 1: 3.6-10 overview window
if(t>3.4&&t<10.4){const p=e((t-3.6)/1.2),o=1-e((t-10)/.4),k=(t-3.6)/6.8;
 h+=`<div class="win" style="opacity:${Math.min(p*1.5,1)*o};transform:translate3d(${-120+k*160}px,${(1-p)*500+40}px,${-900*(1-p)-200+k*120}px) rotateX(${(1-p)*30+8-k*4}deg) rotateY(${-14+k*18}deg)"><img src="ov.png"></div>`;
 [["Счета","44",150,180,0],["Платежи","36",1500,230,1],["Проводки","345",160,820,2],["Курсы","166",1480,800,3]].forEach(([a,b,x,y,i])=>{const q=bk((t-4.6-i*.45)/.6);h+=`<div class="chip" style="left:${x}px;top:${y+Math.sin(t*1.5+i)*8}px;transform:scale(${q*o});border-left:8px solid ${C[i]}">${a} <b>${b}</b></div>`});
 h+=`<div style="opacity:${o}">`+words("Компания за месяц. Ошибки спрятаны.",4.2,t,64,40)+"</div>"}
// scene 2: 10-16 agent
if(t>9.9&&t<16.4){const p=e((t-10)/1),o=1-e((t-16)/.4),k=(t-10)/6;
 h+=`<div class="win" style="opacity:${p*o};transform:translate3d(${200-k*260}px,${80-k*120}px,${-300+k*260}px) rotateY(${12-k*10}deg) rotateX(${6-k*4}deg) rotateZ(${-1+k}deg)"><img src="ag.png"></div>`;
 const n=Math.round(14*eo((t-11)/2.2)),f=(eo((t-11.4)/2.4)).toFixed(3);
 h+=`<div class="chip" style="left:120px;top:140px;transform:scale(${bk((t-11)/.6)*o})">Шаги <b>${n}</b></div><div class="chip" style="left:120px;top:260px;color:${G};transform:scale(${bk((t-11.4)/.6)*o})">F1 <b>${f}</b></div><div class="chip" style="left:120px;top:380px;transform:scale(${bk((t-12.4)/.6)*o})">Найдено <b>${Math.round(10*eo((t-12.4)/1.8))}/10</b></div>`}
// scene 3: 16-21 attacks
if(t>15.9&&t<21.4){const o=1-e((t-21)/.4),p=e((t-16)/.6);
 h+=`<div style="opacity:${p*o}">`+words("Награду не обмануть",16.1,t,96,110)+"</div>";
 [["Пометить всё",-1,C[1]],["Хедж типов",-.48,C[1]],["Повтор вывода",.29,C[2]],["Молчание",-1,"#9aa0a6"],["Честный аудит",.96,G]].forEach(([a,v,c],i)=>{const q=e((t-16.8-i*.3)/.9),y=330+i*120,w=Math.abs(v)*560*q;
  h+=`<div class="lab" style="top:${y+6}px;opacity:${q*o}">${a}</div><div class="bar" style="top:${y}px;left:${v<0?1100-w:1100}px;width:${w}px;background:${c};opacity:${o}"></div><div class="lab" style="top:${y+6}px;left:${v<0?1120:1100+w+20}px;width:150px;text-align:left;opacity:${q*o};font-weight:700">${(v>0?"+":"")+(v*q).toFixed(2)}</div>`});
 h+=`<div style="position:absolute;left:1098px;top:310px;width:4px;height:600px;background:#dadce0;opacity:${o}"></div>`}
// scene 4: 21-27 terminal + title
if(t>20.9){const p=e((t-21)/.7),cmd="python -m audit_env verify",n=Math.floor(cl((t-21.5)/1.4)*cmd.length),ok=t>23.4,m=e((t-24.6)/1);
 h+=`<div class="term" style="margin-top:${-160-m*250}px;opacity:${p*(1-m*.0)};transform:scale(${(.9+.1*p)*(1-m*.25)})"><span style="color:#8ab4f8">$</span> ${cmd.slice(0,n)}<span style="opacity:${Math.floor(t*3)%2}">▍</span><br><span style="color:#81c995;opacity:${ok?1:0}">== OK in 42 s · 221 тест</span></div>`;
 h+=`<div style="position:absolute;left:0;right:0;top:${640-m*40}px;opacity:${m}">`+words("RL‑среда для ИИ‑аудитора",24.8,t,92,0)+"</div>";
 C.forEach((c,i)=>{h+=`<div class="dot" style="background:${c};left:${888+i*40}px;top:${860}px;transform:scale(${bk((t-25.4-i*.1)/.5)})"></div>`})}
S.innerHTML=h}
window.render=render;render(0);
</script></body></html>
