<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Аудит</title>
<link rel="stylesheet" href="/ui/app.css">
<script src="/ui/app.js" defer></script>
</head>
<body>
<header class="titlebar">
  <span class="app-icon" aria-hidden="true">A</span>
  <span class="app-name">Аудит</span>
  <span class="doc-name" id="company">новая книга</span>
  <span class="spacer"></span>
  <span class="episode-info" id="episode-info" hidden>
    <span class="badge" id="mode-badge"></span>
    <span id="period"></span>
    <span class="steps" title="Шагов осталось"><span id="steps-left">100</span>/100</span>
  </span>
  <span class="version" id="version"></span>
</header>

<div class="ribbon" role="toolbar">
  <form class="group" id="create-form" novalidate>
    <div class="group-body">
      <label>Seed <input id="seed" type="number" min="0" step="1" value="202611" required></label>
      <label>Уровень
        <select id="difficulty">
          <option value="easy">Лёгкий</option>
          <option value="medium" selected>Средний</option>
          <option value="hard">Сложный</option>
        </select>
      </label>
      <label>Режим
        <select id="mode">
          <option value="open" selected>Открытый</option>
          <option value="closed">Закрытый</option>
        </select>
      </label>
      <label>Ошибки
        <select id="preset">
          <option value="default" selected>4 основных</option>
          <option value="all">Все</option>
          <option value="interacting">Связанные</option>
          <option value="practice">Из практики</option>
          <option value="clean">Без ошибок</option>
          <option value="custom">Свои…</option>
        </select>
      </label>
      <button type="submit" class="big primary" id="create-btn"><span class="ico">＋</span>Создать</button>
    </div>
    <div class="group-name">Эпизод</div>
  </form>

  <div class="group" id="agent-panel" hidden>
    <div class="group-body">
      <label>Агент
        <select id="policy">
          <option value="expert">Аудитор (правила)</option>
          <option value="micro">Модель micro</option>
          <option value="reconcile">Простая сверка</option>
          <option value="random">Случайный</option>
          <option value="flag-all">Пометить всё</option>
        </select>
      </label>
      <button class="big" id="run-btn"><span class="ico">▶</span>Запустить</button>
    </div>
    <div class="group-name">Проверка</div>
  </div>

  <form class="group" id="import-form" novalidate>
    <div class="group-body">
      <label>Папка <input id="folder" type="text" placeholder="C:\data\episode" autocomplete="off"></label>
      <button type="submit" class="big" id="import-btn"><span class="ico">⇪</span>Открыть</button>
    </div>
    <div class="group-name">Свои данные</div>
  </form>
</div>

<fieldset class="custom-errors" id="custom-errors" hidden>
  <legend>Сколько ошибок каждого типа</legend>
  <div class="grid-row" id="error-counts"></div>
</fieldset>

<main class="sheet-area">
  <section class="empty" id="empty">
    <div class="empty-grid" aria-hidden="true"></div>
    <h1>Нажмите «Создать»</h1>
    <p>Появится компания за месяц со скрытыми ошибками.</p>
  </section>

  <div id="workspace" hidden>
    <section class="tab" id="tab-overview">
      <div class="cards" id="overview-cards"></div>
      <div class="table-wrap"><table class="data" id="types-table"></table></div>
      <details class="task"><summary>Задача агента</summary><p id="task-text"></p></details>
    </section>

    <section class="tab" id="tab-documents" hidden>
      <div class="split">
        <div class="list-col">
          <div class="toolbar">
            <input type="search" id="doc-search" placeholder="Поиск">
            <select id="doc-kind">
              <option value="all">Все</option>
              <option value="invoice">Счета</option>
              <option value="payment">Платежи</option>
            </select>
          </div>
          <div class="table-wrap tall"><table class="data clickable numbered" id="doc-table"></table></div>
        </div>
        <div class="detail-col" id="doc-detail"><p class="muted">Выберите строку.</p></div>
      </div>
    </section>

    <section class="tab" id="tab-ledger" hidden>
      <div class="toolbar">
        <input type="search" id="ledger-search" placeholder="Поиск">
        <select id="ledger-account"><option value="">Все счета</option></select>
        <span class="muted" id="ledger-count"></span>
      </div>
      <div class="table-wrap tall"><table class="data numbered" id="ledger-table"></table></div>
      <div class="pager" id="ledger-pager"></div>
    </section>

    <section class="tab" id="tab-fx" hidden>
      <div class="toolbar"><input type="search" id="fx-search" placeholder="Поиск"></div>
      <div class="table-wrap tall"><table class="data numbered" id="fx-table"></table></div>
    </section>

    <section class="tab" id="tab-agent" hidden>
      <div id="agent-empty" class="muted">Выберите агента на ленте и нажмите «Запустить».</div>
      <div id="agent-result" hidden>
        <div class="cards" id="agent-cards"></div>
        <div id="agent-findings"></div>
        <details class="task"><summary>Шаги агента</summary>
          <div class="table-wrap tall"><table class="data numbered" id="agent-trajectory"></table></div>
        </details>
      </div>
    </section>

    <section class="tab" id="tab-manual" hidden>
      <div class="split">
        <div class="list-col">
          <form id="action-form" class="toolbar action-bar" novalidate>
            <select id="action-type" aria-label="Инструмент">
              <option value="list_records">Страница таблицы</option>
              <option value="get_record">Запись по ID</option>
              <option value="get_document">Документ</option>
              <option value="calculator">Калькулятор</option>
            </select>
            <span id="action-fields" class="inline-fields"></span>
            <button type="submit" class="primary" id="action-btn">Выполнить</button>
          </form>
          <pre class="json" id="observation">—</pre>
          <ol class="history" id="history"></ol>
        </div>
        <div class="detail-col">
          <div class="toolbar">
            <button id="add-finding">＋ Вывод</button>
            <button class="primary" id="submit-btn">Отправить</button>
          </div>
          <div id="drafts"></div>
          <div id="manual-result"></div>
        </div>
      </div>
    </section>

    <section class="tab" id="tab-policy" hidden>
      <div id="policy-view"></div>
    </section>
  </div>
</main>

<footer class="bottom">
  <nav class="sheet-tabs" role="tablist" id="tabs" hidden>
    <button role="tab" data-tab="overview" aria-selected="true">Обзор</button>
    <button role="tab" data-tab="documents">Документы</button>
    <button role="tab" data-tab="ledger">Книга</button>
    <button role="tab" data-tab="fx">Курсы</button>
    <button role="tab" data-tab="agent">Агент</button>
    <button role="tab" data-tab="manual">Вручную</button>
    <button role="tab" data-tab="policy">Правила</button>
  </nav>
  <div class="statusbar"><span id="status" role="status" aria-live="polite">Готово</span></div>
</footer>
</body>
</html>
